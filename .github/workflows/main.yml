name: Build and Test Dash App

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx (для кешу та сумісності)
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t my-dash-app .

      - name: Run Docker container
        run: |
          docker run -d -p 8050:8050 --name dash-app my-dash-app
          sleep 5  # чекаємо запуску

      - name: Test if Dash is running
        run: |
          curl --fail http://localhost:8050 || (echo "App failed to start" && exit 1)

      - name: Stop container
        run: docker stop dash-app
